name: task-manager

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: tasks
      POSTGRES_DB: tasks
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks -d tasks"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    environment:
      APP_ENV: development
      HTTP_ADDR: ":8080"
      LOG_LEVEL: info
      DATABASE_URL: postgres://tasks:tasks@postgres:5432/tasks?sslmode=disable
      # Spans go to Jaeger; unset this to print them to stdout instead.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    # Give in-flight requests the same budget the service uses on shutdown.
    stop_grace_period: 15s

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1h
      # Required for exemplars, which is how a histogram bucket links to a trace.
      - --enable-feature=exemplar-storage
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      # Accept OTLP over HTTP on 4318, which is what the service exports to.
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI
      - "4318:4318"   # OTLP/HTTP, also reachable from the host for local runs
    depends_on:
      - api

volumes:
  pgdata:
